name: Deploy situs ke GitHub Pages

# Men-deploy folder ism-site/ (dokumentasi + playground + halaman spoofer) ke Pages.
# Catatan: halaman spoofer butuh server Node untuk upload — yang di-deploy ke Pages
# hanya bagian statis/preview-nya.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Jalankan test logika inti
        run: node ism-site/tests/core.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ism-site
      - id: deployment
        uses: actions/deploy-pages@v4
